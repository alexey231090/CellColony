<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Godot Game</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <!-- Подключение Яндекс SDK -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <script>
        // Инициализация SDK и получение языка
        let ysdk = null;
        let gameLang = 'ru';

        function initYandexSDK() {
            YaGames.init().then(sdk => {
                ysdk = sdk;
                // Чтение языка из SDK
                if (ysdk && ysdk.environment && ysdk.environment.i18n && ysdk.environment.i18n.lang) {
                    gameLang = ysdk.environment.i18n.lang;
                }
                // Здесь можно передать gameLang в Godot, если нужно
                console.log('Yandex game language:', gameLang);
            }).catch(err => {
                console.error('Yandex SDK init error:', err);
            });
        }

        window.addEventListener('load', initYandexSDK);
    </script>

    <!-- Godot HTML5 exporter обычно вставляет сюда свои скрипты автоматически -->
    <!-- Если используешь Custom HTML, убедись, что Godot-скрипты подключены -->
</body>
</html>
